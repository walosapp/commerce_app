schema: spec-driven

context: |
  Tech stack: ASP.NET Core 8 (backend) + React 18 + Vite + TailwindCSS (frontend)
  Database: Supabase (PostgreSQL) with schemas: core, inventory, sales, finance, suppliers, delivery, audit
  Architecture: Clean Architecture (Domain > Application > Infrastructure > API) + modular frontend
  State: Zustand (global) + TanStack Query (server)
  Auth: JWT with multi-tenant isolation (companyId, branchId in claims)
  AI: OpenAI integration for inventory assistant

strict_tdd: true

testing:
  backend:
    runner: dotnet test
    framework: xUnit
    unit: true
    integration: true
    e2e: false
    coverage: coverlet
    linter: null
    type_checker: dotnet build
  frontend:
    runner: npx vitest run
    framework: vitest
    unit: true
    integration: true
    e2e: true
    e2e_tool: playwright
    coverage: vitest --coverage
    linter: eslint
    type_checker: null
    formatter: null

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Reuse existing services layer where possible
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)
